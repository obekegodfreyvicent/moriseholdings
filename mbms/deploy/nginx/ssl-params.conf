# Shared TLS settings, included by every HTTPS server block in
# app.conf.template. A modern-compatible profile — TLS 1.2 + 1.3 only, no
# legacy ssl_dhparam file needed — plus HSTS so a browser that has ever
# loaded a page over HTTPS refuses to fall back to plain HTTP for it.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers HIGH:!aNULL:!MD5;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
add_header Strict-Transport-Security "max-age=63072000" always;
