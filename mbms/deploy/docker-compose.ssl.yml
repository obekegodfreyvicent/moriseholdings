# Addition to ../docker-compose.yml — a public-facing, TLS-terminating
# reverse proxy plus a Let's Encrypt renewal loop, for a self-hosted / VPS
# deployment of the whole MBMS stack on a server you control with real
# domain names pointed at it (9 September 2026, Update 106).
#
# Netlify (Admin app, Customer Storefront) and Render (backend) already
# auto-provision and auto-renew their own Let's Encrypt certificates and
# need none of this file — see the root README's "SSL / TLS certificates
# (Let's Encrypt)" section. Use this override only for self-hosting.
#
# First run (after copying .env.ssl.example to .env.ssl and filling in
# real domains + a real e-mail address, with DNS already pointed here):
#   ./init-letsencrypt.sh
#
# Every run after that, from mbms/:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.ssl.yml up -d

services:
  nginx-proxy:
    image: nginx:1.27-alpine
    container_name: mbms-nginx-proxy
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
      - storefront
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/app.conf.template:/etc/nginx/templates/app.conf.template:ro
      - ./nginx/ssl-params.conf:/etc/nginx/ssl-params.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    env_file:
      - .env.ssl
    # envsubst only the three domain vars (explicitly listed) so nginx's
    # own runtime $variables (e.g. $host, $remote_addr) in the template
    # are left untouched — the $$ pairs are docker compose's own escaping
    # for a literal "$", resolved once at compose-file parse time.
    command: >
      sh -c "envsubst '$$ADMIN_DOMAIN $$STOREFRONT_DOMAIN $$API_DOMAIN' < /etc/nginx/templates/app.conf.template > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"

  # Renews certificates every 12h (certbot itself no-ops unless a
  # certificate is within 30 days of expiry) — no host cron needed.
  # Issuance itself happens via init-letsencrypt.sh, not this service.
  certbot:
    image: certbot/certbot
    container_name: mbms-certbot
    restart: unless-stopped
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
