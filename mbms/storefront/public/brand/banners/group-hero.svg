<svg width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-label="Morise Holdings Limited — one group, every input, every mile, every store" xmlns="http://www.w3.org/2000/svg">
  <title>Morise Holdings Limited — group hero banner</title>
  <defs>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16283F"/>
      <stop offset="0.55" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#2E5395"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="520" fill="url(#mg)"/>

  <!-- oversized logomark watermark, bled off the right edge -->
  <g transform="translate(1150 -120) scale(6.2)" opacity="0.08">
    <path d="M32 94 V40 L64 74 L96 40 V94" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- route motif -->
  <g opacity="0.5" stroke="#FFFFFF" stroke-width="2" fill="none">
    <polyline points="96,430 360,430 520,360 820,360 1010,300 1360,300"/>
  </g>
  <g fill="#FFFFFF" opacity="0.65">
    <circle cx="96" cy="430" r="5"/><circle cx="520" cy="360" r="5"/><circle cx="1010" cy="300" r="5"/><circle cx="1360" cy="300" r="5"/>
  </g>
  <circle cx="360" cy="430" r="7" fill="#D97706"/>
  <circle cx="820" cy="360" r="7" fill="#D97706"/>

  <!-- lockup -->
  <g transform="translate(96 96)">
    <rect x="0" y="0" width="88" height="88" rx="20" fill="#FFFFFF"/>
    <path d="M22 66 V28 L44 52 L66 28 V66" fill="none" stroke="#1E3A5F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M44 14 L53 23 L44 32 L35 23 Z" fill="#D97706"/>
  </g>

  <text x="208" y="132" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="5" fill="#D97706">MORISE HOLDINGS LIMITED</text>
  <text x="94" y="258" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" letter-spacing="0.5" fill="#FFFFFF">One group.</text>
  <text x="94" y="330" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="0.3" fill="#FFFFFF">Every input, every mile, every store.</text>
  <text x="96" y="398" font-family="Inter, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="rgba(255,255,255,0.82)">Agricultural inputs &amp; fuel · Logistics · Clearing &amp; forwarding · Warehousing · Collateral management</text>
</svg>
