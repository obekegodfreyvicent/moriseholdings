server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mirrors vite.config.js's dev-server proxy: /api/* goes to the backend
    # container (Docker Compose's internal DNS resolves "backend" to the
    # mbms-backend service) rather than being served as a static file.
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routing: any path that isn't a real static file falls
    # back to index.html so a deep link or a page reload still resolves.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
